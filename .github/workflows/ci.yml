# Pruebas por niveles (docs/pruebas.md). La suite completa corre aqui, en cada
# PR, y no en la sesion de Claude Code. Sin secretos: la app apunta al mock de
# Supabase (tests/servidor-mock) y las pruebas de base de datos a un Postgres
# efimero del propio job, que cada prueba llena con las migraciones y la
# semilla (tests/ayudantes/base-de-datos.ts).
name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  rapido:
    name: Nivel 0 (rapido)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint y pruebas sin navegador
        run: npm run test:rapido

  completo:
    name: Nivel 2 (suite completa)
    needs: rapido
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Postgres efimero de este job. Valores de prueba, no son secretos.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache de Chromium
        id: cache-navegadores
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar Chromium
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias del sistema para Chromium
        if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build y suite completa
        run: npm run test:completo

      - name: Subir reporte y trazas (solo si fallo)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
